[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 自作のプログラムから SIO を使うためのライブラリ sio_client だけを導入する。
#   pip install <このフォルダ>
# SIO Service（sio_service）と sio_cli は、このフォルダで直接実行する（README.md を参照）。
[project]
name = "sio-client"
version = "0.1.0"
description = "Score IO (SIO) client library for Python"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aike" }]
dependencies = []

[tool.setuptools]
packages = ["sio_client"]
